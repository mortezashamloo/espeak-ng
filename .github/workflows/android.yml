name: Android

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-debug:
    runs-on: ubuntu-latest
    name: Build debug APK
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle
      - name: Apply Persian fixes
        run: python3 apply-espeak-fix.py --no-emoji
      - name: make
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Sign APK with the espeak key
        env:
          KEYSTORE_B64: ${{ secrets.ESPEAK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ESPEAK_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Signing secrets are not set, leaving the APK as built"
            exit 0
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/espeak.p12"
          IN=android/build/outputs/apk/debug/espeak-debug.apk
          OUT=android/build/outputs/apk/debug/espeak-debug.apk
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/espeak.p12" --ks-key-alias espeak --ks-pass env:KEYSTORE_PASSWORD --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/signed.apk"
          rm -f "$IN"
          mv -f "$RUNNER_TEMP/signed.apk" "$OUT"
          rm -f "$RUNNER_TEMP/espeak.p12" "$RUNNER_TEMP/aligned.apk"
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: android-debug.apk
          path: android/build/outputs/apk/debug/espeak-debug.apk
          retention-days: 5

  build-release:
    runs-on: ubuntu-latest
    name: Build release APK
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle
      - name: Apply Persian fixes
        run: python3 apply-espeak-fix.py --no-emoji
      - name: make
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Sign APK with the espeak key
        env:
          KEYSTORE_B64: ${{ secrets.ESPEAK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ESPEAK_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Signing secrets are not set, leaving the APK as built"
            exit 0
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/espeak.p12"
          IN=android/build/outputs/apk/release/espeak-release-unsigned.apk
          OUT=android/build/outputs/apk/release/espeak-release.apk
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/espeak.p12" --ks-key-alias espeak --ks-pass env:KEYSTORE_PASSWORD --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/signed.apk"
          rm -f "$IN"
          mv -f "$RUNNER_TEMP/signed.apk" "$OUT"
          rm -f "$RUNNER_TEMP/espeak.p12" "$RUNNER_TEMP/aligned.apk"
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: android-release.apk
          path: android/build/outputs/apk/release/*.apk
          retention-days: 5

  test:
    runs-on: ubuntu-latest
    name: Instrumented tests
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle
      - name: Apply Persian fixes
        run: python3 apply-espeak-fix.py --no-emoji
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash android/ci-test.sh
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: android/build/reports/androidTests/
          retention-days: 5
