name: Create signing keystore (run once)

# Run this ONCE, by hand (Actions tab, then Run workflow).  It builds the private signing key for the
# espeak Android app on GitHub's machine, so the key never passes through anyone else.
# Before running: create the repository secret ESPEAK_KEYSTORE_PASSWORD (a long password, 20+ characters).
on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    name: Create keystore
    steps:
      - name: Create keystore
        env:
          KS_PASS: ${{ secrets.ESPEAK_KEYSTORE_PASSWORD }}
          EXISTING: ${{ secrets.ESPEAK_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -n "$EXISTING" ]; then
            echo "::error::The secret ESPEAK_KEYSTORE_BASE64 already exists. Refusing to create a second, different key."
            exit 1
          fi
          if [ -z "$KS_PASS" ]; then
            echo "::error::Create the repository secret ESPEAK_KEYSTORE_PASSWORD first."
            exit 1
          fi
          if [ ${#KS_PASS} -lt 20 ]; then
            echo "::error::ESPEAK_KEYSTORE_PASSWORD is too short. Use at least 20 characters."
            exit 1
          fi
          keytool -genkeypair -keystore espeak-release.p12 -storetype PKCS12 -alias espeak -keyalg RSA -keysize 4096 -validity 36500 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=eSpeak Persian Fix, C=IR"
          base64 -w0 espeak-release.p12 > keystore-base64.txt
          rm -f espeak-release.p12
      - name: Upload the keystore (as text)
        uses: actions/upload-artifact@v7
        with:
          name: keystore-base64
          path: keystore-base64.txt
          retention-days: 1
