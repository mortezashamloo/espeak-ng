name: windows-msbuild

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    name: "build: ${{ matrix.platform }} - ${{ matrix.config }}"
    strategy:
      fail-fast: false
      matrix:
        config: [Release]
        platform: [x86, x64]

    steps:
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Install Windows 8.1 SDK
        shell: powershell
        run: |
          Invoke-WebRequest -Method Get -Uri https://go.microsoft.com/fwlink/p/?LinkId=323507 -OutFile sdksetup.exe -UseBasicParsing
          Start-Process -Wait sdksetup.exe -ArgumentList "/q", "/norestart", "/features", "OptionId.WindowsDesktopSoftwareDevelopmentKit", "OptionId.NetFxSoftwareDevelopmentKit"

      - name: Install WiX
        run: dotnet tool install --global wix

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Checkout pcaudiolib
        uses: actions/checkout@v7
        with:
          repository: "espeak-ng/pcaudiolib"
          path: "src/pcaudiolib"

      - name: Apply Persian and x86 fixes
        shell: pwsh
        run: python apply-espeak-fix.py --no-emoji

      - name: Build Solution (libespeak-ng SAPI5, data, and MSI installer)
        working-directory: "src/windows"
        shell: pwsh
        run: |
          msbuild espeak-ng.sln /p:Configuration=${{ matrix.config }} /p:Platform=${{ matrix.platform }}

      - name: Prepare SAPI5 Standalone Package
        shell: pwsh
        run: |
          $pkg = "sapi5-package-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Get-ChildItem -Path "src/windows" -Recurse -Include "*.dll","*.exe" | Where-Object { $_.FullName -match "${{ matrix.config }}" } | ForEach-Object {
            Copy-Item $_.FullName -Destination $pkg -Force
          }
          Copy-Item "espeak-ng-data" -Destination "$pkg/espeak-ng-data" -Recurse -Force

          # Detect exact CLSID from src/windows/com/ttsengine.cpp or Product.wxs
          $clsid = "{BF42466F-7063-477F-AD6B-26A2B5C7C472}"
          if (Test-Path "src/windows/installer/Product.wxs") {
            $wxs = Get-Content "src/windows/installer/Product.wxs" -Raw
            if ($wxs -match '\{[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}\}') {
              # Also check comentrypoints.c for CLSID_TTSEngine
            }
          }

          $bat = @'
          @echo off
          setlocal
          cd /d "%~dp0"
          echo Registering eSpeak-NG SAPI5 Engine (libespeak-ng.dll)...
          regsvr32 /s "%~dp0libespeak-ng.dll"

          rem Find registered eSpeak-NG CLSID or use standard eSpeak-NG SAPI5 token format
          for /f "tokens=*" %%A in ('reg query "HKLM\SOFTWARE\Classes\CLSID" /s /f "libespeak-ng.dll" 2^>nul ^| findstr /i "HKEY_LOCAL_MACHINE\\SOFTWARE\\Classes\\CLSID\\"') do (
              for /f "tokens=5 delims=\" %%G in ("%%A") do set "FOUND_CLSID=%%G"
          )
          if not defined FOUND_CLSID (
              for /f "tokens=*" %%A in ('reg query "HKLM\SOFTWARE\WOW6432Node\Classes\CLSID" /s /f "libespeak-ng.dll" 2^>nul ^| findstr /i "HKEY_LOCAL_MACHINE\\SOFTWARE\\WOW6432Node\\Classes\\CLSID\\"') do (
                  for /f "tokens=6 delims=\" %%G in ("%%A") do set "FOUND_CLSID=%%G"
              )
          )
          if not defined FOUND_CLSID set "FOUND_CLSID={D92890B0-C02E-462D-BC20-A7C6B985E576}"

          echo Using CLSID: %FOUND_CLSID%
          for %%K in (
              "HKLM\SOFTWARE\Microsoft\Speech\Voices\Tokens"
              "HKLM\SOFTWARE\WOW6432Node\Microsoft\Speech\Voices\Tokens"
          ) do (
              reg add "%%~K\eSpeakNG_fa" /ve /d "eSpeak-NG Persian (fa)" /f >nul 2>&1
              reg add "%%~K\eSpeakNG_fa" /v "409" /d "eSpeak-NG Persian (fa)" /f >nul 2>&1
              reg add "%%~K\eSpeakNG_fa" /v "CLSID" /d "%FOUND_CLSID%" /f >nul 2>&1
              reg add "%%~K\eSpeakNG_fa" /v "Path" /d "%~dp0" /f >nul 2>&1
              reg add "%%~K\eSpeakNG_fa" /v "VoiceName" /d "fa" /f >nul 2>&1
              reg add "%%~K\eSpeakNG_fa\Attributes" /v "Gender" /d "Male" /f >nul 2>&1
              reg add "%%~K\eSpeakNG_fa\Attributes" /v "Language" /d "429" /f >nul 2>&1
              reg add "%%~K\eSpeakNG_fa\Attributes" /v "Name" /d "eSpeak-NG Persian" /f >nul 2>&1
              reg add "%%~K\eSpeakNG_fa\Attributes" /v "Vendor" /d "eSpeak-NG" /f >nul 2>&1
          )
          echo Done! eSpeak-NG Persian SAPI5 voice is now registered.
          pause
          '@
          Set-Content -Path "$pkg/register-sapi5.bat" -Value $bat -Encoding ASCII

      - name: Upload MSI installer (${{ matrix.platform }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.platform }}-${{ matrix.config }}-msi
          path: "src/windows/**/*.msi"
          if-no-files-found: ignore

      - name: Upload SAPI5 Standalone Package (${{ matrix.platform }})
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.platform }}-sapi5-standalone
          path: "sapi5-package-${{ matrix.platform }}/"