name: windows-sapi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    name: "eSpeak NG SAPI5 (Windows 7+)"

    steps:
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pefile
        run: pip install pefile

      - name: Apply Persian fix (American accent, no emoji)
        shell: pwsh
        run: python apply-espeak-fix.py --no-emoji

      - name: Apply Windows 7 / SAPI5 changes
        shell: pwsh
        run: python apply-sapi-win7.py

      - name: Build x86 SAPI5 DLL
        working-directory: "src/windows"
        shell: pwsh
        run: msbuild libespeak-ng.vcxproj /p:Configuration=Release /p:Platform=x86

      - name: Check and collect x86 DLL
        shell: pwsh
        run: python check-win7-imports.py x86 espeak-ng-sapi/x86

      - name: Build x64 SAPI5 DLL
        working-directory: "src/windows"
        shell: pwsh
        run: msbuild libespeak-ng.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Check and collect x64 DLL
        shell: pwsh
        run: python check-win7-imports.py x64 espeak-ng-sapi/x64

      - name: Build espeak-ng-data (Persian & English dictionaries)
        shell: pwsh
        run: |
          cmake -B build-data -DBUILD_SHARED_LIBS=OFF -DUSE_ASYNC=OFF -DUSE_MBROLA=OFF -DUSE_LIBSONIC=OFF -DUSE_LIBPCAUDIO=OFF -DCOMPILE_INTONATIONS=ON
          cmake --build build-data --config Release --target data

      - name: Assemble package
        shell: pwsh
        run: |
          $dataPath = if (Test-Path "build-data/espeak-ng-data/phontab") { "build-data/espeak-ng-data" } elseif (Test-Path "espeak-ng-data/phontab") { "espeak-ng-data" } else { throw "espeak-ng-data was not built" }
          Copy-Item $dataPath -Destination "espeak-ng-sapi/espeak-ng-data" -Recurse -Force
          Copy-Item "install-sapi.bat" -Destination "espeak-ng-sapi/" -Force
          Copy-Item "uninstall-sapi.bat" -Destination "espeak-ng-sapi/" -Force

      - name: Upload SAPI5 package
        uses: actions/upload-artifact@v4
        with:
          name: espeak-ng-sapi5-win7
          path: "espeak-ng-sapi/"